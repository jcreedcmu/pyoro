<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>pyoro layout skeleton</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --topbar: 48px;
        --status: 32px;
        --pad-fraction: 20%;
      }

      html, body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      /* `fixed` with all four sides pinned is the viewport itself, so
         there is no choice of height unit to get wrong. A flex column
         then divides it, and the four regions always add up to it. */
      #root {
        position: fixed;
        top: 0px;
        left: 0px;
        right: 0px;
        bottom: 0px;
        display: flex;
        flex-direction: column;
        font: 12px/1.4 monospace;
        color: #fff;
      }

      #root > div {
        box-sizing: border-box;
        padding: 2px 6px;
        overflow: hidden;
        white-space: pre;
      }

      #topbar {
        flex: 0 0 calc(var(--topbar) + var(--safe-top));
        padding-top: calc(2px + var(--safe-top));
        background: #2f6690;
      }

      /* The only region that stretches. min-height lets it shrink below
         its content rather than pushing the others off the screen. */
      #play {
        flex: 1 1 0;
        min-height: 0;
        background: #3a7d44;
      }

      #status {
        flex: 0 0 var(--status);
        background: #8c5e2a;
      }

      #pad {
        flex: 0 0 calc(var(--pad-fraction) + var(--safe-bottom));
        padding-bottom: calc(2px + var(--safe-bottom));
        background: #6a2e5c;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="topbar">topbar</div>
      <div id="play">play area</div>
      <div id="status">status</div>
      <div id="pad">control pad</div>
    </div>

    <script>
      const regions = ['topbar', 'play', 'status', 'pad'];

      function report() {
        const viewport = innerHeight;
        let sum = 0;
        for (const id of regions) {
          const el = document.getElementById(id);
          const r = el.getBoundingClientRect();
          sum += r.height;
          const share = (r.height / viewport * 100).toFixed(1);
          el.firstChild.textContent =
            `${id}  ${Math.round(r.width)}x${r.height.toFixed(1)}  ${share}%`;
        }
        const pad = document.getElementById('pad').getBoundingClientRect();
        document.getElementById('play').firstChild.textContent +=
          `\ninnerHeight ${viewport}`
          + `\nregions sum ${sum.toFixed(1)}`
          + `\npad bottom to innerHeight ${(viewport - pad.bottom).toFixed(1)}`;
      }

      report();
      addEventListener('resize', report);
      addEventListener('orientationchange', report);
      if (window.visualViewport) {
        visualViewport.addEventListener('resize', report);
        visualViewport.addEventListener('scroll', report);
      }
      // Every frame, so a glitch that only shows while the url bar is
      // moving is visible rather than having to be caught.
      (function tick() { report(); requestAnimationFrame(tick); })();
    </script>
  </body>
</html>
